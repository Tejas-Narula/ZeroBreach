<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0c1017"/>
  <!-- Central Hub chassis -->
  <rect x="14" y="24" width="36" height="24" rx="4" stroke="#0ea5e9" stroke-width="3" fill="#0284c7" fill-opacity="0.2"/>
  <!-- Central node circle -->
  <circle cx="32" cy="36" r="4" fill="#38bdf8"/>
