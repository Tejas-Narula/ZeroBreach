  <line x1="36" y1="36" x2="42" y2="36" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="21" cy="36" r="2" fill="#38bdf8"/>
  <circle cx="43" cy="36" r="2" fill="#38bdf8"/>
  <!-- Upper & Lower links -->
  <line x1="32" y1="17" x2="32" y2="24" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="16" r="2" fill="#38bdf8"/>
  <line x1="32" y1="48" x2="32" y2="55" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="55" r="2" fill="#38bdf8"/>
</svg>
